# Connexion au panel de gestion de serveurs
panel:
  # Panel utilisé : pterodactyl ou pelican
  type: pterodactyl

  url: https://panel.exemple.com

  # Token d'API *client* (compte utilisateur), pas un token d'API application
  token: abc

# Contrôle d'accès aux serveurs gérés.
#
# Il s'applique aux ÉVÉNEMENTS de connexion, et non au menu de sélection : le
# menu se contente de demander un serveur, comme le ferait un /server. Aucun
# chemin détourné — commande, hôte forcé, redirection d'un autre plugin — ne
# contourne donc la règle.
#
# Trois portes doivent s'ouvrir : la restriction propre au proxy, la permission
# du plugin, puis la liste blanche du serveur.
access:
  enabled: true

  # Exiger la permission panelautostarter.join.<serveur>.
  #
  # Désactivé par défaut à dessein : l'activer d'emblée fermerait tous les
  # serveurs d'une installation existante dès la mise à jour, personne n'ayant
  # encore accordé la permission. Accordez-la dans LuckPerms, puis passez ceci
  # à true.
  #
  # Aucune intégration LuckPerms n'est nécessaire : le plugin interroge l'API
  # de permissions du proxy, que LuckPerms alimente en s'y greffant.
  require-permission: false

  # Réutiliser la restriction déclarée au proxy plutôt que de la redéclarer.
  #
  # BungeeCord possède la notion en propre : un serveur marqué « restricted »
  # dans sa configuration exige bungeecord.server.<nom>. Velocity n'a pas
  # d'équivalent, ce réglage y est donc sans effet.
  respect-proxy-restrictions: true

  # Motif du nœud de permission. Le %s reçoit le nom du serveur, en minuscules.
  # Un motif sans %s est refusé : tous les serveurs partageraient la même
  # permission et la restriction par serveur ne voudrait plus rien dire.
  permission-format: "panelautostarter.join.%s"

# Les listes blanches, elles, vivent dans whitelist.yml, à côté de ce fichier :
# elles se modifient en jeu, et réécrire ce fichier à chaque ajout en effacerait
# les commentaires.
#
# Permission et liste blanche répondent à deux besoins distincts : la première
# dit QUEL GROUPE a le droit d'entrer et se gère dans LuckPerms, la seconde
# QUELLES PERSONNES et se gère en jeu. Une liste blanche ne dispense pas de la
# permission.

# Configuration du système de file d'attente et démarrage des serveurs
server-start:
  # Fréquence de vérification de l'état du serveur en secondes (temps normal)
  check-interval-normal: 15

  # Fréquence de vérification de l'état du serveur en secondes (pendant le démarrage)
  check-interval-startup: 3

  # Interroger le panel sur l'état du serveur, en plus de le pinger.
  #
  # Le panel est la source la plus sûre pour constater une disparition : il
  # sait que le serveur est arrêté, souvent parce que c'est lui qui l'a
  # arrêté, là où le ping doit attendre l'expiration d'une connexion. Sans
  # cela, un serveur éteint reste cru en ligne le temps de plusieurs sondages,
  # pendant lesquels les joueurs ne sont ni mis en file ni suivis d'un
  # redémarrage — ils se heurtent à une connexion qui expire.
  #
  # L'inverse n'est pas vrai : un panel qui annonce le serveur démarré ne
  # garantit pas que le jeu accepte les connexions. Le passage EN LIGNE reste
  # donc décidé par le ping seul.
  #
  # Coût : un appel à l'API du panel par serveur et par sondage. À désactiver
  # si votre panel est lent ou si vous gérez beaucoup de serveurs.
  use-panel-state: true

  # Attente maximale, en secondes, d'une réponse à un ping de surveillance.
  #
  # Un serveur en cours de démarrage accepte la connexion — le port est publié
  # avant que le jeu n'écoute — sans y répondre. Sans cette borne, le proxy
  # patiente son propre délai de lecture, une trentaine de secondes, pendant
  # lesquelles aucun nouveau sondage n'est émis : check-interval-startup réglé
  # à 3 s en vaudrait alors 33, et la mise en ligne se constaterait avec près
  # d'une minute de retard.
  #
  # Un sondage abandonné ne dit rien à la machine à états : le serveur n'est
  # pas considéré comme éteint, le sondage suivant retente simplement.
  ping-timeout: 3

  # Fréquence de vérification d'un serveur éteint que personne ne ping.
  # Inutile d'interroger toutes les 15 s un serveur que personne ne regarde.
  check-interval-idle: 60

  # Durée en secondes sans aucun ping client avant de considérer qu'un serveur
  # n'est plus regardé et de passer à check-interval-idle.
  idle-threshold: 300

  # Durée de validité en secondes du ping mis en cache et servi dans le MOTD.
  # Au-delà, le prochain ping client déclenche un rafraîchissement en arrière-plan
  # (la réponse courante est servie immédiatement, sans attendre).
  # Baisser cette valeur rend le compteur de joueurs plus réactif, au prix de
  # requêtes plus fréquentes vers le serveur.
  ping-cache-ttl: 5

  # Temps d'attente en secondes avant de commencer à TP les joueurs après que le serveur soit ONLINE
  # Cela laisse le temps au serveur de bien se lancer avant de recevoir des joueurs
  #
  # Ce délai est décompté sur sa propre échéance, indépendamment de
  # check-interval-normal : il vaut exactement ce qui est écrit ici.
  wait-before-teleport: 5

  # Délai entre chaque téléportation de joueur (en secondes) pour éviter les overloads
  teleport-delay: 1

# Affichage dans la liste des serveurs quand un serveur géré n'est pas en ligne.
#
# Chaque champ se règle séparément, et séparément pour l'état hors-ligne et
# l'état démarrage. Une valeur inconnue n'empêche pas le plugin de démarrer :
# le défaut s'applique et un avertissement est écrit dans la console.
#
# Valeurs possibles
#   description   cached  le MOTD du serveur, mémorisé quand il était en ligne
#                 plugin  un texte généré par le plugin annonçant l'état
#                 proxy   ne rien changer à la réponse du proxy
#   favicon       cached  l'icône du serveur, mémorisée puis décorée ci-dessous
#                 bundled l'icône générique livrée avec le plugin
#                 proxy   ne rien changer
#   players       zero    0 joueur connecté
#                 queue   le nombre de joueurs en file d'attente
#                 proxy   ne rien changer
#   max-players   zero    0, ce qui affiche « 0/0 »
#                 cached  le maximum mémorisé, ce qui affiche « 0/20 »
#                 proxy   ne rien changer
#   hover         plugin  une explication, et la file d'attente s'il y en a une
#                 none    rien
#                 proxy   ne rien changer
#   version-label none    aucune étiquette, le compteur de joueurs reste visible
#                 text    « Hors-ligne » en rouge À LA PLACE du compteur
#
# À savoir : version-label et le compteur de joueurs occupent le même
# emplacement côté client. Mettre version-label à « text » rend donc les
# réglages players et max-players invisibles. C'était le comportement de la 2.x.
#
# favicon-grayscale et favicon-badge ne s'appliquent qu'à « favicon: cached ».
# Les icônes livrées portent déjà leur propre indicateur.
#
# Quelques combinaisons utiles
#   Défaut ci-dessous       l'identité du serveur est conservée, l'état se lit
#                           sur l'icône et au survol
#   Comme en 2.x            description: plugin, favicon: bundled,
#                           version-label: text
#   Discret                 favicon-badge: false, favicon-grayscale: true
#   Ne rien changer         tout sur « proxy », version-label: none
motd:
  offline:
    description: cached
    favicon: cached
    favicon-grayscale: true
    favicon-badge: true
    players: zero
    max-players: zero
    hover: plugin
    version-label: none

  starting:
    description: cached
    favicon: cached
    favicon-grayscale: false
    favicon-badge: true
    players: zero
    max-players: zero
    hover: plugin
    version-label: none

queue:
  # Serveur d'attente où patientent les joueurs pendant le démarrage
  server: lobby

  # Renvoyer vers le serveur d'attente un joueur éjecté d'un serveur géré,
  # plutôt que de le laisser être déconnecté.
  #
  # Sans cela, le sort du joueur dépend de la façon dont le serveur a coupé la
  # connexion : une fermeture brutale déclenche le repli automatique du proxy,
  # une déconnexion propre le laisse déconnecter le joueur. D'où un
  # comportement erratique quand un serveur s'arrête.
  #
  # Une exclusion volontaire n'est PAS rattrapée : un joueur expulsé par un
  # administrateur reste dehors, avec son motif.
  catch-kicks: true

  # Motifs de déconnexion à considérer comme un arrêt du serveur plutôt que
  # comme une exclusion volontaire. Comparaison insensible à la casse, sur une
  # correspondance partielle.
  #
  # Le plugin reconnaît déjà seul un arrêt qu'il a lui-même demandé, un serveur
  # devenu injoignable, ou une connexion coupée sans un mot. Cette liste ne sert
  # qu'au cas restant : un arrêt lancé depuis le panel, qui annonce « Server
  # closed » avant que la surveillance n'ait rien constaté. Adaptez-la à la
  # langue et aux plugins de votre serveur.
  shutdown-reasons:
    - "Server closed"
    - "Server is restarting"
    - "Serveur fermé"
    - "Multiplayer is disabled"

  # Retour adressé au joueur ainsi rattrapé, à son arrivée sur le serveur
  # d'attente. Il reprend les durées de « title » ci-dessous.
  kick-feedback:
    enabled: true
    sound:
      name: block.note_block.bass
      volume: 1.0
      pitch: 0.8

  # Barre d'action affichée au-dessus de la barre d'inventaire tant que le
  # joueur attend, avec le serveur attendu, son état et la place dans la file.
  #
  # Elle est réémise en boucle, et non envoyée une fois : le client efface la
  # barre d'action de lui-même au bout de quelques secondes, un envoi unique
  # ne tiendrait donc pas le temps d'un démarrage.
  #
  # Elle s'efface d'elle-même pendant le compte à rebours, où le titre dit
  # déjà la même chose en plus grand.
  #
  # Disponible sur les deux proxys, contrairement aux sons : la barre d'action
  # est une variante du paquet de chat, que BungeeCord sait fabriquer.
  actionbar:
    enabled: true

    # Délai entre deux rafraîchissements, en millisecondes.
    # Ramené entre 250 et 3000 : en deçà on inonde le client pour rien,
    # au-delà la barre s'efface entre deux envois.
    interval: 1000

    # Affiche la place dans la file (« 2/5 »). Sans effet pour un joueur qui
    # attend seul : lui annoncer « 1/1 » ne lui apprend rien.
    show-position: true

  # Titre affiché au joueur au moment où il rejoint la file d'attente.
  # Durées en millisecondes.
  title:
    enabled: true
    fade-in: 300
    stay: 2500
    fade-out: 500

    # Son accompagnant le titre. Laisser « name » vide pour aucun son.
    # La forme courte « sound: block.note_block.bell » est acceptée : le volume
    # et la hauteur gardent alors leurs valeurs par défaut.
    #
    # Le volume propre à chaque son varie énormément dans le jeu : certains,
    # comme block.amethyst_block.chime, restent inaudibles même à plein volume.
    # Si les sous-titres affichent bien le son mais que vous n'entendez rien,
    # changez-en plutôt que de monter le volume.
    sound:
      name: block.note_block.bell
      volume: 1.0
      pitch: 1.0

  # Compte à rebours affiché juste avant la téléportation, une fois le serveur
  # prêt. Il s'ajoute à server-start.wait-before-teleport : le plugin attend
  # d'abord ce délai en silence, puis décompte à l'écran.
  countdown:
    enabled: true
    seconds: 3

    # Sons joués à chaque seconde, puis au moment du départ.
    # Laisser « name » vide pour n'en jouer aucun.
    #
    # Le volume compte autant que le choix du son : un son répété à chaque
    # seconde devient vite agressif à plein volume.
    #
    # ATTENTION, deux limites :
    #  - Velocity uniquement. BungeeCord n'expose aucune API de son — le proxy
    #    achemine les paquets sans en fabriquer — ces réglages y sont donc sans
    #    effet, et le plugin le signale au démarrage.
    #  - Client 1.19.3 minimum. En deçà, Velocity ne peut pas émettre le son et
    #    l'ignore silencieusement. Le décompte reste affiché à l'écran.
    tick-sound:
      name: block.note_block.hat
      volume: 0.5
      pitch: 1.0

    go-sound:
      name: entity.experience_orb.pickup
      volume: 0.7
      pitch: 1.2

# Le nom de chaque serveur doit correspondre exactement à celui déclaré dans
# la configuration de votre proxy (BungeeCord ou Velocity).
servers:
  lobby:
    id: abc
