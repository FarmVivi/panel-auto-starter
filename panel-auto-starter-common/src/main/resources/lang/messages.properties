# PanelAutoStarter — English (fallback language)
#
# This file is read as UTF-8: write accents and non-Latin characters as they
# are, not as \uXXXX escapes.
#
# {0}, {1}… are placeholders filled in by the plugin. Keep them, and keep their
# meaning — their order may change to suit your language, but a missing one
# loses information.
#
# Colours are NOT set here: they belong to the plugin's design and are the same
# in every language. Only the wording is yours.
#
# A key you delete falls back to the shipped text, so translating half a file
# is perfectly fine.

