# PanelAutoStarter — Français
#
# Ce fichier est lu en UTF-8 : écrivez les accents tels quels, pas en
# séquences \uXXXX.
#
# {0}, {1}… sont des paramètres remplis par le plugin. Gardez-les, et gardez
# leur sens — leur ordre peut changer pour coller à la langue, mais en
# supprimer un fait perdre une information.
#
# Les couleurs ne sont PAS ici : elles relèvent du design du plugin et valent
# pour toutes les langues. Seule la formulation vous appartient.
#
# Une clé supprimée retombe sur le texte d'origine : traduire à moitié ne pose
# aucun problème.

