name: Release Build

permissions:
  contents: write   # pour uploader l’artefact sur la release

on:
  release:
    types: [ created ]

jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: '25'
          distribution: "temurin"

      # Un seul cache : « cache: maven » de setup-java doublait celui-ci sur le
      # même dossier. Seul le dépôt local est mis en cache, pas ~/.m2 entier,
      # sinon la restauration écraserait le settings.xml que setup-java vient
      # d'écrire par une copie ancienne. Voir sonarqube-analysis.yml pour le
      # repli par préfixe et le préfixe propre à chaque workflow.
      - name: Cache Maven repository
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-release-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-release-
            ${{ runner.os }}-m2-

      # Étape pour enlever "-SNAPSHOT" dans le pom.xml (multi-module)
      - name: Remove -SNAPSHOT from pom.xml (all modules)
        run: mvn versions:set -DremoveSnapshot -DgenerateBackupPoms=false -DprocessAllModules

      # Construction Maven avec optimisations
      - name: Build with Maven
        run: mvn -T1C package -DskipTests -Dmaven.test.skip=true -Dmaven.javadoc.skip=true

      # Upload des JARs sur la release GitHub
      - name: Upload JARs to release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: |
            panel-auto-starter-bungee/target/panel-auto-starter-bungee-*.jar
            panel-auto-starter-velocity/target/panel-auto-starter-velocity-*.jar
